schema: spec-driven

context: |
  OpenSSF Scorecard: a Go CLI and library (module
  github.com/ossf/scorecard/v5) that assesses open source repositories
  against security heuristics and reports a 0-10 score per check plus a
  risk-weighted aggregate score.

  Architecture: checks run in three tiers.
  - Raw data collection (checks/raw/) gathers evidence through repository
    clients (clients/: GitHub, GitLab, Azure DevOps, local directory, git).
  - Probes (probes/) turn raw data into findings with outcomes; each probe
    has a def.yml describing it and its remediation.
  - Evaluation (checks/evaluation/) turns probe findings into check scores.
  Results are rendered by pkg/scorecard in default, json, sarif, probe, raw,
  and in-toto formats. Policies (policy/) select checks and drive SARIF
  output; the attestor (attestor/) has its own policy format.

  Current versus target state: openspec/specs/ describes v5 behavior as
  built, including known defects, so that fixing a defect shows up as an
  explicit spec delta. The changes/osps-baseline-conformance proposal
  describes a v6 target (checks and conformance in one run) and is not
  current behavior; in v5, running probes directly skips checks.

  Conventions: see AGENTS.md and CONTRIBUTING.md. Changes to score results
  need strong justification and an issue first. Adding a check follows
  checks/write.md; adding a probe follows probes/README.md. PR titles carry
  an emoji prefix (:sparkles:, :bug:, :book:, :seedling:, :warning:,
  :ghost:). Commits are signed off (DCO). `make all` runs tests, lint, fmt,
  and go mod tidy.

rules:
  specs:
    - Describe observable behavior (inputs, outputs, scores, errors, flags,
      environment variables), not internal Go identifiers
    - Every requirement uses SHALL or MUST and has at least one scenario
    - Record current behavior, including defects; put intended corrections
      in a change under openspec/changes/
    - State each behavior in exactly one capability and refer to it from
      others; see openspec/README.md for ownership
  proposal:
    - Say whether each claim describes current behavior or a target state
    - Name every affected capability by its path under openspec/specs/
