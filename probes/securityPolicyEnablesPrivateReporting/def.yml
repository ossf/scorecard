id: securityPolicyEnablesPrivateReporting
lifecycle: experimental
short: Check whether the repository accepts private vulnerability reports.
motivation: >
  Private vulnerability reporting lets a researcher disclose a bug without opening a public issue.
  On GitHub this is a repository setting, separate from the text of SECURITY.md.
implementation: >
  The implementation calls the host API for private vulnerability reporting.
  GitHub is GET /repos/{owner}/{repo}/private-vulnerability-reporting.
  Other hosts, and a failed lookup, produce OutcomeNotApplicable and do not change the score.
outcome:
  - If private vulnerability reporting is enabled, one finding with OutcomeTrue is returned.
  - If it is disabled, one finding with OutcomeFalse is returned.
  - If the host does not expose the setting, or the lookup fails, one finding with OutcomeNotApplicable is returned.
remediation:
  onOutcome: False
  effort: Low
  text:
    - Enable private vulnerability reporting in the repository settings.
    - GitHub documents the setting at https://docs.github.com/en/code-security/security-advisories/repository-security-advisories/configuring-private-vulnerability-reporting-for-a-repository
  markdown:
    - Enable private vulnerability reporting in the repository settings.
    - 'GitHub: [configuring private vulnerability reporting](https://docs.github.com/en/code-security/security-advisories/repository-security-advisories/configuring-private-vulnerability-reporting-for-a-repository).'
ecosystem:
  languages:
    - all
  clients:
    - github
