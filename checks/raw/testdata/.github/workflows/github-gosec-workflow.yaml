name: gosec
on:
  pull_request: {}
  push:
    branches:
      - main
permissions:
  contents: read

jobs:
  gosec:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run gosec security scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out results.sarif ./...'
