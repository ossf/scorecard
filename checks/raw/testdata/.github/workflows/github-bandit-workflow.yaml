name: Bandit
on:
  pull_request: {}
  push:
    branches:
      - main
permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Bandit Scan
        uses: PyCQA/bandit-action@v1
        with:
          targets: .
