---
stages:
  - test
  - release

test:
  stage: test
  image: composer:2
  script:
    - composer install
    - vendor/bin/phpunit

packagist:
  stage: release
  image: curlimages/curl
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - >-
      curl -X POST -H 'Content-Type: application/json'
      "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_API_TOKEN}"
      -d '{"repository":{"url":"https://packagist.org/packages/vendor/package"}}'
