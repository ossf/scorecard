name: Something is wrong
description: A wrong check result or score, an error or hang, a problem with scorecard.dev, the API, the weekly scan, or a badge, or a mistake in the docs.
title: "Issue: "
labels: ["kind/bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        One problem per issue. Describe what you see before what you think causes it, and check the latest release first.
        Don't report security vulnerabilities here; use [private vulnerability reporting](https://github.com/ossf/scorecard/security/advisories/new).
        If you used AI to write this report, you are responsible for its accuracy.
        To add a repository to the weekly scan, follow [ossf/scorecard-infra](https://github.com/ossf/scorecard-infra/blob/main/CONTRIBUTING.md) instead.
  - type: dropdown
    id: kind
    attributes:
      label: What went wrong
      options:
        - Wrong check result or score
        - Error, crash, or hang
        - Website, API, weekly scan, or badge
        - Documentation
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: How Scorecard was run
      options:
        - CLI
        - GitHub Action
        - REST API
        - scorecard.dev website
        - Weekly scan data
        - Badge
        - Not run (documentation)
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: Command, version, or URL
      description: |
        CLI: the exact command and the output of `scorecard version`.
        Action: the workflow step and Action tag, or a link to the run.
        API, website, scan data, or badge: the URL or query.
        Documentation: write "n/a".
    validations:
      required: true
  - type: dropdown
    id: check
    attributes:
      label: Check (optional)
      options:
        - Binary-Artifacts
        - Branch-Protection
        - CI-Tests
        - CII-Best-Practices
        - Code-Review
        - Contributors
        - Dangerous-Workflow
        - Dependency-Update-Tool
        - Fuzzing
        - License
        - Maintained
        - Packaging
        - Pinned-Dependencies
        - SAST
        - SBOM
        - Security-Policy
        - Signed-Releases
        - Token-Permissions
        - Vulnerabilities
        - Webhooks
        - Not check-specific
  - type: input
    id: link
    attributes:
      label: Link
      description: A public repository that shows the problem, at a commit or at the exact file or line. For docs, the doc line.
      placeholder: https://github.com/owner/repo/blob/<commit>/.github/workflows/ci.yml#L12
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What you saw
      description: Paste output and error messages as text in a code block, including the check's details. Don't paraphrase.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: The result you expected, with a link to the check's documentation and the evidence the check missed. For docs, the proposed wording.
    validations:
      required: true
  - type: textarea
    id: existing
    attributes:
      label: Existing issues
      description: Links to related open or closed issues, or the search terms you used if nothing matched.
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Before you submit
      options:
        - label: I searched open and closed issues before filing.
          required: true
        - label: I reproduced this on the latest release, or I saw it on the website, the API, the weekly scan, a badge, or in the docs.
          required: true
        - label: I can answer follow-up questions. Issues with unanswered questions may be closed.
          required: true
